<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <meta name="description" content="Muzyk, kompozytor i specjalista od AI. Fingerstyle, muzyka na żywo, kompozycja oraz badania i projekty IT." />
    <title>Solo Repertoire</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .lang-switch button { cursor: pointer; padding: 5px 10px; border: 1px solid #ccc; background: white; margin-left: 5px; border-radius: 4px;}
        .lang-switch button.active { background: #333; color: white; border-color: #333; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #eee; cursor: pointer; border-radius: 5px; font-size: 16px; transition: 0.2s; }
        .tab-btn.active { background: #007BFF; color: white; font-weight: bold; }

        .search-box { margin-bottom: 20px; width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}

        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .origin { color: #666; font-size: 0.9em; font-style: italic; }
        
        .link-btn { text-decoration: none; padding: 5px 10px; background: #eee; border-radius: 4px; color: #333; font-size: 0.9em; margin-right: 5px; display: inline-block;}
        .link-btn.yt:hover { background: #ff0000; color: white; }
        .link-btn.notes:hover { background: #28a745; color: white; }

        .loading { font-style: italic; color: #666; margin-bottom: 10px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 id="ui-main-title">Repertuar Solo</h1>
        <div class="lang-switch">
            <button id="btn-pl" class="active" onclick="setLanguage('pl')">PL</button>
            <button id="btn-en" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchView('live')" id="btn-live">🎵 Repertuar na żywo</button>
        <button class="tab-btn" onclick="switchView('recordings')" id="btn-recordings">🎥 Nagrania i Nuty</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="Szukaj..." onkeyup="renderCurrentView()">

    <div id="loading-msg" class="loading">Pobieranie danych...</div>

    <!-- WIDOK 1: GRA NA ŻYWO -->
    <div id="view-live" class="view-section active">
        <table id="table-live">
            <thead>
                <tr>
                    <th style="width: 40%" class="ui-th-title">Tytuł</th>
                    <th style="width: 30%" class="ui-th-artist">Artysta</th>
                    <th style="width: 30%" class="ui-th-origin">Skąd znane</th>
                </tr>
            </thead>
            <tbody id="tbody-live"></tbody>
        </table>
    </div>

    <!-- WIDOK 2: NAGRANIA I NUTY -->
    <div id="view-recordings" class="view-section">
        <table id="table-recordings">
            <thead>
                <tr>
                    <th style="width: 30%" class="ui-th-title">Tytuł</th>
                    <th style="width: 25%" class="ui-th-artist">Artysta</th>
                    <th style="width: 25%" class="ui-th-origin">Skąd znane</th>
                    <th style="width: 20%" id="ui-th-materials">Materiały</th>
                </tr>
            </thead>
            <tbody id="tbody-recordings"></tbody>
        </table>
    </div>

    <script>
        // TUTAJ WKLEJ LINK CSV Z GOOGLE SHEETS
        const publicSpreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vReh5S09MVyIzTJrv6Dx5vqcFoY1tcCZFTpjd9yyyqr1RLMVef7UWzbpjnMyV9Jb8JzTgUx8--EDsiK/pub?gid=1845498032&single=true&output=csv';
        
        let allSongs = [];
        let currentMode = 'live'; 
        let currentLang = 'pl';

        const translations = {
            pl: {
                mainTitle: "Repertuar Solo",
                btnLive: "🎵 Repertuar na żywo",
                btnRec: "🎥 Nagrania i Nuty",
                searchPlaceholder: "Szukaj po tytule, artyście lub pochodzeniu...",
                thTitle: "Tytuł",
                thArtist: "Artysta",
                thOrigin: "Skąd znane",
                thMaterials: "Materiały",
                loading: "Pobieranie danych z Google Sheets...",
                btnNotes: "🎼 Nuty"
            },
            en: {
                mainTitle: "Solo Repertoire",
                btnLive: "🎵 Live Repertoire",
                btnRec: "🎥 Recordings & Sheets",
                searchPlaceholder: "Search by title, artist, or origin...",
                thTitle: "Title",
                thArtist: "Artist",
                thOrigin: "Known from",
                thMaterials: "Materials",
                loading: "Fetching data from Google Sheets...",
                btnNotes: "🎼 Sheets"
            }
        };

        Papa.parse(publicSpreadsheetUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                processData(results.data);
                document.getElementById('loading-msg').style.display = 'none';
                updateUI();
                renderCurrentView();
            }
        });

        function processData(rawData) {
            allSongs = rawData.map(row => {
                let ytLink = (row['YouTube'] && row['YouTube'].trim() !== '-') ? row['YouTube'].trim() : null;
                let notesLink = (row['nuty'] && row['nuty'].trim() !== '-') ? row['nuty'].trim() : null;

                // Tytuły - używamy nagłówków "Tytuł" i "Title"
                let titlePl = row['Tytuł'] ? row['Tytuł'].trim() : '';
                let titleEn = (row['Title'] && row['Title'].trim() !== '') ? row['Title'].trim() : titlePl;

                // Pochodzenie - używamy nagłówków "Skąd znane" i "Known from"
                let originPl = row['Skąd znane'] ? row['Skąd znane'].trim() : '';
                
                // --- LOGIKA DLA POCHODZENIA EN + "LUDOWA" ---
                let originEn = '';
                if (row['Known from'] && row['Known from'].trim() !== '') {
                    // Jeśli wpisałeś coś ręcznie w kolumnę "Known from", zawsze bierzemy Twoją wartość
                    originEn = row['Known from'].trim();
                } else {
                    // Jeśli puste, sprawdzamy czy polska wersja to "ludowa"
                    if (originPl.toLowerCase() === 'ludowa') {
                        originEn = 'folk'; // Automatyczne tłumaczenie
                    } else {
                        originEn = originPl; // Fallback do wersji polskiej
                    }
                }

                return {
                    artist: row['Artysta'] ? row['Artysta'].trim() : '',
                    ytLink: ytLink,
                    notesLink: notesLink,
                    title: { pl: titlePl, en: titleEn },
                    origin: { pl: originPl, en: originEn }
                };
            }).filter(song => song.title.pl !== '');
        }

        // --- ZARZĄDZANIE JĘZYKIEM I UI ---

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-pl').classList.toggle('active', lang === 'pl');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            updateUI();
            renderCurrentView();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('ui-main-title').innerText = t.mainTitle;
            document.getElementById('btn-live').innerText = t.btnLive;
            document.getElementById('btn-recordings').innerText = t.btnRec;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('loading-msg').innerText = t.loading;
            document.getElementById('ui-th-materials').innerText = t.thMaterials;

            document.querySelectorAll('.ui-th-title').forEach(el => el.innerText = t.thTitle);
            document.querySelectorAll('.ui-th-artist').forEach(el => el.innerText = t.thArtist);
            document.querySelectorAll('.ui-th-origin').forEach(el => el.innerText = t.thOrigin);
        }

        function switchView(mode) {
            currentMode = mode;
            document.getElementById('btn-live').classList.toggle('active', mode === 'live');
            document.getElementById('btn-recordings').classList.toggle('active', mode === 'recordings');
            document.getElementById('view-live').classList.toggle('active', mode === 'live');
            document.getElementById('view-recordings').classList.toggle('active', mode === 'recordings');
            renderCurrentView();
        }

        // --- RENDEROWANIE TABEL ---

        function renderCurrentView() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            let filteredSongs = allSongs.filter(song => {
                const matchTitle = song.title[currentLang].toLowerCase().includes(searchQuery);
                const matchArtist = song.artist.toLowerCase().includes(searchQuery);
                const matchOrigin = song.origin[currentLang].toLowerCase().includes(searchQuery);
                return matchTitle || matchArtist || matchOrigin;
            });

            if (currentMode === 'live') {
                renderLive(filteredSongs);
            } else {
                renderRecordings(filteredSongs);
            }
        }

        function renderLive(songs) {
            const tbody = document.getElementById('tbody-live');
            tbody.innerHTML = '';

            songs.forEach(song => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${song.title[currentLang]}</strong></td>
                    <td>${song.artist}</td>
                    <td class="origin">${song.origin[currentLang]}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderRecordings(songs) {
            const tbody = document.getElementById('tbody-recordings');
            tbody.innerHTML = '';

            const recordingsOnly = songs.filter(song => song.ytLink !== null);
            const btnNotesText = translations[currentLang].btnNotes; 

            recordingsOnly.forEach(song => {
                const tr = document.createElement('tr');
                
                let linksHTML = '';
                if (song.ytLink) {
                    linksHTML += `<a href="${song.ytLink}" target="_blank" class="link-btn yt">▶ YouTube</a>`;
                }
                if (song.notesLink) {
                    linksHTML += `<a href="${song.notesLink}" target="_blank" class="link-btn notes">${btnNotesText}</a>`;
                }

                tr.innerHTML = `
                    <td><strong>${song.title[currentLang]}</strong></td>
                    <td>${song.artist}</td>
                    <td class="origin">${song.origin[currentLang]}</td>
                    <td>${linksHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
